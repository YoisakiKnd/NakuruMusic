name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT setting `RUSTFLAGS: -D warnings` globally: that would
  # promote warnings inside third-party crates to errors, so an upstream
  # release could break this build for reasons we cannot fix. The clippy
  # step below applies `-D warnings` to our own code only.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # ALSA headers are needed to build the audio stack's dependencies.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libasound2-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The `--ignored` tests hit YouTube/LRCLIB and are intentionally
      # excluded here: CI must not depend on third-party availability.
      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release
