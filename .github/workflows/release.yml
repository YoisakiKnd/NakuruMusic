name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          # Both mac targets build on Apple Silicon runners: Xcode ships
          # both SDKs, so x86_64 cross-compiles fine. The old Intel
          # `macos-13` label is being retired and jobs queue forever on it.
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libasound2-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Package with the docs so a downloaded archive is self-explanatory.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "ytbm-tui-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ytbm-tui.exe" $name/
          Copy-Item README.md, LICENSE $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name="ytbm-tui-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/ytbm-tui" "$name/"
          cp README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## 安装

            下载对应平台的压缩包解压即可。内置播放器无需外部程序；在配置文件中设置
            `[playback] engine = "native"` 即可启用。默认仍使用 mpv：

            ```
            scoop install mpv             # 或 winget install mpv
            ```

            mpv 是默认音频引擎。播放地址通常由程序自行解析；mpv 模式解析失败时，
            yt-dlp 可作为兜底。程序会自动在 PATH、scoop、Program Files 中寻找 mpv。

            完整说明见 [README](https://github.com/YoisakiKnd/ytbm-tui#readme)。
