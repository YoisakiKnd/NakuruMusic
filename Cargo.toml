[package]
name = "nakuru-music"
version = "0.2.1"
edition = "2021"
description = "NakuruMusic, a lightweight YouTube Music TUI with built-in playback"
license = "GPL-3.0-only"

[dependencies]
ratatui = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22.27"
directories = "6"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
async-trait = "0.1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
unicode-width = "0.2"
rustypipe = { version = "0.11.4", features = ["userdata"] }
innertube-rs = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# chafa-dyn (a default feature) needs the native chafa C library via
# pkg-config, which Windows does not have — the built-in halfblock renderer
# covers the same fallback role.
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
aes-gcm = "0.11.0"
base64 = "0.23.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp4"] }
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

# rustypipe 0.11.4 panics on visitor-data fetch errors. Keep the local patch
# until upstream propagates the error normally; see vendor/rustypipe.
# Symphonia 0.5.5 scans fragmented MP4 media data while opening and seeking.
# The local patch uses complete sidx indexes for bounded-start and direct seeks.
[patch.crates-io]
rustypipe = { path = "vendor/rustypipe" }
symphonia-format-isomp4 = { path = "vendor/symphonia-format-isomp4" }
